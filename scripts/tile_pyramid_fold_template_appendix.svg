<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11.0in" viewBox="0 0 8.5 11.0">
<rect x="0" y="0" width="8.5" height="11.0" fill="white"/>
<g id="appendix" font-family="Helvetica, Arial, sans-serif">
<text x="0.7500" y="1.0100" font-family="Helvetica, Arial, sans-serif" font-size="0.2083" font-weight="bold" fill="#000" text-anchor="start">Web Mercator Tile Pyramid — Fold Template</text>
<text x="0.7500" y="1.4500" font-family="Helvetica, Arial, sans-serif" font-size="0.1250" font-weight="normal" fill="#000" text-anchor="start">z0 → z4  ·  16×16 finest grid  ·  cell 0.750in  ·  15 creases per axis</text>
<line x1="0.7500" y1="1.9000" x2="1.3500" y2="1.9000" stroke="#1D4F91" stroke-width="0.0333" stroke-dasharray="0.16,0.08" stroke-linecap="round" />
<text x="1.4500" y="1.9300" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">valley fold (odd k)</text>
<line x1="3.3500" y1="1.9000" x2="3.9500" y2="1.9000" stroke="#B5471B" stroke-width="0.0333" stroke-dasharray="0.2,0.05,0.04,0.05" stroke-linecap="round" />
<text x="4.0500" y="1.9300" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">mountain fold (even k)</text>
<text x="0.7500" y="2.4000" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">line weight = fold level: bold = z1 (center crease) … thin = z4 (finest crease)  —  level(k) = 4 − v₂(k)</text>
<text x="0.7500" y="2.8000" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">Fold 1: accordion-fold every vertical crease (alternating valley/mountain) to collapse columns.</text>
<text x="0.7500" y="3.0600" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">Fold 2: accordion-fold every horizontal crease the same way to collapse rows.</text>
<text x="0.7500" y="3.3200" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#000" text-anchor="start">Partially unfold either axis to reveal any intermediate zoom level z — the grid's z-ticks mark which crease belongs to which level.</text>
<text x="0.7500" y="3.7200" font-family="Helvetica, Arial, sans-serif" font-size="0.1111" font-weight="normal" fill="#666" text-anchor="start">Cell labels are quadkeys (tiles.js quadkey(x, y, z) at z = 4) — same tile ID the web app uses.</text>
